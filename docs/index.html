<script>
    // Replace this with your actual Render service URL.
    const API_URL = "https://fitbuddy-ai-fitness-plan-generator-iziw.onrender.com";

    const form = document.getElementById("fitnessForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();
        result.textContent = "Generating your plan. Please wait...";

        try {
            const response = await fetch(`${API_URL}/generate`, {
                method: "POST",
                body: new FormData(form)
            });

            if (!response.ok) {
                throw new Error(`Server returned ${response.status}`);
            }

            const html = await response.text();
            const parsed = new DOMParser().parseFromString(html, "text/html");

            // Display the generated result page inside this page.
            result.replaceChildren(...Array.from(parsed.body.childNodes));

        } catch (error) {
            console.error(error);
            result.textContent =
                "Could not generate the plan. Check the Render URL and backend CORS settings.";
        }
    });
</script>
</body>
